<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>CharityClarity 29.2N — Isolated validation</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{font:16px system-ui;color:#0b2a5b;background:#f8fafc;max-width:1000px;margin:2rem auto;padding:1rem}label{display:block;margin:1rem 0}input,textarea{display:block;width:100%;padding:.65rem;box-sizing:border-box}button{padding:.8rem;background:#c62828;color:white;border:0;border-radius:5px;margin:.4rem}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:white;padding:1rem}small{color:#52667f}</style>
<script src="/ny-connector.js" defer></script><script src="/optimized-workflows.js" defer></script></head>
<body><h1>CharityClarity 29.2N — Isolated validation</h1>
<p>Uses the master name discovery, workflow and browser connector. Staging 29.1 is separate.</p>
<p id="connectorStatus">Checking the trial connector…</p><button id="checkConnector" type="button">Check trial connector</button>
<form id="setup"><label>Compliance Express email<input id="email" type="email" required autocomplete="off"></label>
<label>Private trial key<input id="passcode" type="password" required autocomplete="off"></label>
<label>Load local validation settings<input id="settingsFile" type="file" accept="application/json,.json"></label>
<small>The file fills this form. Credentials are not saved or exported.</small>
<label>Validation cases (JSON)<textarea id="cases" rows="8" required></textarea></label>
<button id="start">Start validation</button></form>
<p id="progress" role="status">Ready for inputs.</p><button id="download" type="button">Download validation results</button>
<pre id="results">[]</pre>
<script>
'use strict';
const VERSION='2026.09.29.2-performance-lab',API=location.origin;
const setup=document.getElementById('setup'),progress=document.getElementById('progress'),output=document.getElementById('results');
const EXTERNAL=new Set(['NY','IL','GA','AL','NC','NV','TN','NM']);
let connectorCheck=null;
function checkConnector(){
 if(connectorCheck)return connectorCheck;
 const status=document.getElementById('connectorStatus'),button=document.getElementById('checkConnector');
 status.textContent='Checking the trial connector…';button.disabled=true;
 connectorCheck=new Promise(resolve=>{
  const id=crypto.randomUUID().replaceAll('-','');let timer;
  const finish=response=>{clearTimeout(timer);window.removeEventListener('message',receive);
   status.textContent=response?.ok&&typeof response.version==='string'
    ?`Active trial connector: ${response.version}. Required for this validation: 0.6.30.`
    :'The trial connector did not respond. Activate the installed trial connector, then check again.';
   resolve(response);
  };
  const receive=event=>{const m=event.data;
   if(event.source===window&&event.origin===location.origin&&m?.channel==='cc-final-four-trial-v1'&&m.direction==='response'&&m.id===id&&!m.progress)finish(m);
  };
  window.addEventListener('message',receive);timer=setTimeout(()=>finish(null),5000);
  window.postMessage({channel:'cc-final-four-trial-v1',direction:'request',id,action:'ping'},location.origin);
 }).finally(()=>{connectorCheck=null;button.disabled=false;});
 return connectorCheck;
}
document.getElementById('checkConnector').addEventListener('click',checkConnector);
window.addEventListener('load',checkConnector,{once:true});
document.getElementById('settingsFile').addEventListener('change',async event=>{
 const file=event.target.files?.[0];if(!file)return;
 try{if(file.size>1000000)throw Error('Settings file too large');const settings=JSON.parse(await file.text());
  if(typeof settings.email!=='string'||typeof settings.admin_passcode!=='string'||!Array.isArray(settings.cases))throw Error('Invalid settings');
  document.getElementById('email').value=settings.email;document.getElementById('passcode').value=settings.admin_passcode;
  document.getElementById('cases').value=JSON.stringify(settings.cases,null,2);progress.textContent='Settings loaded. Ready to start.';
 }catch(error){progress.textContent=error.message;}finally{event.target.value='';}
});
document.getElementById('download').addEventListener('click',()=>{
 const url=URL.createObjectURL(new Blob([output.textContent],{type:'application/json'}));
 const a=document.createElement('a');a.href=url;a.download='charityclarity-final-four-validation.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
});
setup.addEventListener('submit',async event=>{
 event.preventDefault();let cases;
 try{cases=JSON.parse(document.getElementById('cases').value);
  if(!Array.isArray(cases)||!cases.length||cases.length>101||cases.some(r=>!r.organization_name||!/^\d{9}$/.test(r.ein)||!Array.isArray(r.states)||!r.states.length))throw Error('Invalid cases');
 }catch(error){progress.textContent=error.message;return;}
 const credentials={email:document.getElementById('email').value.trim(),admin_passcode:document.getElementById('passcode').value,device_id:crypto.randomUUID()};
 setup.hidden=true;document.getElementById('passcode').value='';const completed=[];
 for(const row of cases){
  let aliases=row.alternate_names||[],discovery=null,discoverySeconds=null;const started=Date.now(),connectorProgress=[];
  progress.textContent=`${completed.length+1}/${cases.length}: ${row.organization_name}`;
  try{
   if(row.discover!==false){
    const begin=performance.now();progress.textContent+= ' — discovering names';
    const response=await fetch(API+'/api/discover-names',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+credentials.admin_passcode},
     signal:AbortSignal.timeout(70000),body:JSON.stringify({...credentials,organization_name:row.organization_name,ein:row.ein})});
    discovery=await response.json();discoverySeconds=(performance.now()-begin)/1000;
    if(!response.ok)throw Error('Name discovery HTTP '+response.status);
    aliases=(discovery.names||[]).filter(n=>!n.identity_conflict).slice(0,32).map(n=>n.name);
   }
   const mode=row.mode==='sales'?'sales':'standard',controller=new AbortController(),results=new Map(),checkStart=Date.now();
   const timeout=setTimeout(()=>controller.abort(),mode==='sales'?60000:900000);
   try{
    await window.CCOptimized.run({apiBase:API,name:row.organization_name,ein:row.ein,states:row.states,aliases,mode,credentials,signal:controller.signal,
     onResult:result=>{results.set(result.state,result);progress.textContent=`${completed.length+1}/${cases.length}: ${row.organization_name} — ${results.size}/${row.states.length} states`;},
     externalLookup:(state,names)=>window.CCNYConnector.lookup({...credentials,organization_name:row.organization_name,ein:row.ein,state,mode,
      alternate_names:names,signal:controller.signal,onProgress:(message,stage)=>{progress.textContent=message;
       if(stage&&connectorProgress.length<1000)connectorProgress.push({seconds:(Date.now()-checkStart)/1000,...stage});}})});
   }catch(error){if(!controller.signal.aborted)throw error;}finally{clearTimeout(timeout);}
   for(const state of row.states)if(!results.has(state))results.set(state,{state,ein:row.ein,organization_name:row.organization_name,status:'Unable to Confirm',success:false,
    comments:'The state did not complete within this validation run.',status_reason:mode==='sales'?'SALES_TIME_LIMIT':'WORKFLOW_INCOMPLETE'});
   const values=Array.from(results.values());
   for(const result of values)if(result.app_version&&(result.app_version!==VERSION||String(result.ein).replace(/\D/g,'')!==row.ein))throw Error('Result release or identity mismatch');
   completed.push({trial_release:'29.2N',organization_name:row.organization_name,ein:row.ein,mode,states:row.states,started_epoch:started/1000,
    discovery_seconds:discoverySeconds,discovery,alternate_names:aliases,connector_progress:connectorProgress,check_seconds:(Date.now()-checkStart)/1000,results:values});
   output.textContent=JSON.stringify(completed,null,2);
   if(row.stop_on_inconclusive!==false&&values.some(r=>!r.success||/Unable|Review|Reachable|Unknown/.test(r.status))){progress.textContent=`Paused for investigation after ${completed.length}/${cases.length}.`;return;}
  }catch(error){completed.push({organization_name:row.organization_name,ein:row.ein,started_epoch:started/1000,error:error.message,discovery_seconds:discoverySeconds});
   output.textContent=JSON.stringify(completed,null,2);progress.textContent=`Paused for investigation: ${error.message}`;return;}
 }
 progress.textContent=`Completed ${completed.length}/${cases.length}.`;
});
</script></body></html>
