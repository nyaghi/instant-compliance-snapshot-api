<table class="table table-striped" id="tblCFSearch">
                                    <thead>
                                        <tr>
                                            <td class="bg-primary" ng-click="search(page,null,'OrganizationName')"><strong>Organization Name</strong><!-- ngIf: cftSearchcriteria.SortType == 'ASC'&&cftSearchcriteria.SortBy == 'OrganizationName' --><!-- ngIf: cftSearchcriteria.SortType == 'DESC'&&cftSearchcriteria.SortBy == 'OrganizationName' --></td>
                                            <td class="bg-primary" ng-click="search(page,null,'CityName')"><strong>City Name</strong><!-- ngIf: cftSearchcriteria.SortType == 'ASC'&&cftSearchcriteria.SortBy == 'CityName' --><!-- ngIf: cftSearchcriteria.SortType == 'DESC'&&cftSearchcriteria.SortBy == 'CityName' --></td>

                                            <td class="bg-primary" ng-click="search(page,null,'OrganizationName')"><strong>County Name</strong></td>-->
                                            <td class="bg-primary" ng-click="search(page,null,'PercentToProgramServices')"><strong>Percent to Program Services (Ranges of 10%)</strong><!-- ngIf: cftSearchcriteria.SortType == 'ASC'&&cftSearchcriteria.SortBy == 'PercentToProgramServices' --><!-- ngIf: cftSearchcriteria.SortType == 'DESC'&&cftSearchcriteria.SortBy == 'PercentToProgramServices' --></td>

                                        </tr>
                                    </thead>
                                    <tbody data-ng-show="cftSearchcriteria.CFSearchList.length&gt;0" class="" style="">

                                            <td><a class="btn-link ng-binding text-uppercase" ng-click="showBusineInfo(cf.CFTId,cf.BusinessType)" data-ng-bind="cf.EntityName + ((cf.AKANames != null &amp;&amp; cf.AKANames != '')?'('+cf.AKANames+')':'')">HUMAN APPEAL INC.</a></td>

                                            <td data-ng-bind="cf.EntityMailingAddress.CountyName"></td>-->
                                            <td data-ng-bind="cf.PercentToProgramServices" class="ng-binding">54</td>
                                            <td data-ng-bind="cf.Status" class="ng-binding">Active</td>

                                            <!--<td data-ng-bind="cf.TaxExStatus"></td>-->

                                        </tr><!-- end ngRepeat: cf in cftSearchcriteria.CFSearchList -->
                                    </tbody>

                                    </tbody>
                                </table>
