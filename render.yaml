services:
  - type: web
    name: instant-compliance-snapshot-api
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt && python -m playwright install chromium
    startCommand: python registry_snapshot_server.py
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PUBLIC_BASE_URL
        sync: false
      - key: PYTHONUNBUFFERED
        value: "1"
